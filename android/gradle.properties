# Memory for Gradle and the Kotlin compiler.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# The Swift toolchain and Swift SDK for Android the native game is built with (see README.md).
# The host toolchain and the SDK must be the same version.
swift.version=6.4.2
# The API level in the Swift target triple; it must not be above the app's minSdk.
swift.androidApiLevel=23
